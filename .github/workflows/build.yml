name: Build Module Loader package
on:
  push:
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP on PHP ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "php:${{ matrix.php }}-cli" \
            sh -c 'find . -name "*.php" -type f -print0 | xargs -0 -n1 php -l'
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test clipboard behavior
        run: node --test tests/copy.test.cjs
      - name: Build installer
        run: python3 tools/build.py
      - name: Check ZIP contents
        run: python3 -m zipfile -t dist/SQS_Copy_Text-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SQS_Copy_Text-1.0.0
          path: dist/SQS_Copy_Text-1.0.0.zip
          if-no-files-found: error
