name: Build Module Loader package
on:
  push:
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - name: Lint PHP on PHP ${{ matrix.php }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "php:${{ matrix.php }}-cli" \
            sh -c 'find . -name "*.php" -type f -print0 | xargs -0 -n1 php -l'
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test clipboard behavior
        run: node --test tests/copy.test.cjs
      - name: Check Module Loader scanner compatibility
        run: docker run --rm -v "$PWD:/work:ro" -w /work php:7.4-cli php tests/check_scanner.php
      - name: Test SuiteCRM installation hook contract
        run: docker run --rm -v "$PWD:/work:ro" -w /work php:7.4-cli php tests/check_hooks.php
      - name: Test in-place upgrades and file ownership
        run: |
          for version in 1.0.5 1.0.6; do
            for mode in valid modified uninstalled; do
              docker run --rm -v "$PWD:/work:ro" -w /work php:7.4-cli php tests/check_upgrade.php "$mode" "$version"
            done
          done
      - name: Test Detail View hook without template replacement
        run: docker run --rm -v "$PWD:/work:ro" -w /work php:7.4-cli php tests/check_detail_hook.php
      - name: Build installer
        run: python3 tools/build.py
      - name: Check ZIP contents
        run: |
          python3 -m zipfile -t dist/SQS_Copy_Text-1.0.7.zip
          python3 tests/check_archive.py
      - uses: actions/upload-artifact@v5
        with:
          name: SQS_Copy_Text-1.0.7
          path: dist/SQS_Copy_Text-1.0.7.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php-lint, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build installer for release
        run: python3 tools/build.py
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.7 >/dev/null 2>&1; then
            echo "Release v1.0.7 already exists; skipping publication."
          else
            gh release create v1.0.7 dist/SQS_Copy_Text-1.0.7.zip \
              --target "$GITHUB_SHA" \
              --title "SQS Copy Text 1.0.7" \
              --prerelease \
              --notes "Shows localized copied feedback beside the clicked icon for three seconds without changing field layout. Upgrades in place from 1.0.3 through 1.0.6 and preserves Studio field selections. Verify on a test CRM. SuiteCRM 7.14.x with PHP 7.4 is outside the official compatibility matrix."
          fi
